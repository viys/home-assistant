blueprint:
  name: Sync Remote Temperature Sources to TP-WGZBA
  author: Sonoff
  description: 'Synchronizes one to three external temperature sources with a SONOFF
    TP-WGZBA thermostat through ZHA. The TP-WGZBA also supports Zigbee2MQTT, but this
    blueprint currently implements the ZHA path; Zigbee2MQTT support is under development.
    Firmware 0x00001004 uses the existing single-source protocol; firmware 0x00001006
    and newer use three incremental remote-temperature slots. On older firmware, source
    2 and source 3 are ignored and only source 1 is synchronized.

    '
  domain: automation
  input:
    target_device:
      name: TP-WGZBA device
      description: Select the ZHA TP-WGZBA thermostat that should receive the temperatures.
      selector:
        device:
          filter:
          - integration: zha
            manufacturer: SONOFF
            model: TP-WGZBA
          multiple: false
    source_entity_1:
      name: Remote temperature source 1
      description: Required. Select a temperature sensor from another device.
      selector:
        entity:
          filter:
          - domain:
            - sensor
            device_class:
            - temperature
          multiple: false
          reorder: false
    source_entity_2:
      name: Remote temperature source 2 (optional)
      description: Leave empty when a second remote source is not used.
      default: ''
      selector:
        entity:
          filter:
          - domain:
            - sensor
            device_class:
            - temperature
          multiple: false
          reorder: false
    source_entity_3:
      name: Remote temperature source 3 (optional)
      description: Leave empty when a third remote source is not used.
      default: ''
      selector:
        entity:
          filter:
          - domain:
            - sensor
            device_class:
            - temperature
          multiple: false
          reorder: false
  source_url: https://raw.githubusercontent.com/viys/home-assistant-blueprints/master/automation/sonoff/remote_temperature_sources_link_tp_wgzba.yaml
variables:
  target_device: !input target_device
  source_entity_1: !input source_entity_1
  source_entity_2: !input source_entity_2
  source_entity_3: !input source_entity_3
  source_entities: "{{ [source_entity_1, source_entity_2, source_entity_3]\n   | map('trim')
    | list }}\n"
  full_sync: '{{ trigger.id in [''ha_started'', ''automation_reloaded''] }}'
  target_ieee: "{%- for identifier in (device_attr(target_device, 'identifiers') or
    []) -%}\n  {%- if identifier[0] == 'zha' -%}\n    {{ identifier[1] }}\n  {%- endif
    -%}\n{%- endfor %}\n"
  target_sw_version: '{{ device_attr(target_device, ''sw_version'') or '''' }}'
  supports_multi_remote_temperature: "{% set version = target_sw_version | trim |
    lower %} {% if version.startswith('0x') and version[2:] | length == 8 %}\n  {%
    set encoded_version = version[2:] | int(default=0, base=16) %}\n  {{ encoded_version
    >= 4102 }}\n{% else %}\n  false\n{% endif %}\n"
  has_extra_sources: '{{ source_entity_2 | trim != '''' or source_entity_3 | trim
    != '''' }}

    '
triggers:
- trigger: event
  id: source_changed
  event_type: state_changed
- trigger: homeassistant
  id: ha_started
  event: start
- trigger: event
  id: automation_reloaded
  event_type: automation_reloaded
conditions:
- condition: template
  value_template: "{{ trigger.id in ['ha_started', 'automation_reloaded']\n   or trigger.event.data.entity_id
    in source_entities }}\n"
- condition: template
  value_template: "{{ target_ieee | trim != ''\n   and device_attr(target_device,
    'manufacturer') == 'SONOFF'\n   and device_attr(target_device, 'model') == 'TP-WGZBA'\n
    \  and source_entity_1 | trim != ''\n   and source_entity_1 not in (device_entities(target_device)
    or [])\n   and is_number(states(source_entity_1))\n   and state_attr(source_entity_1,
    'unit_of_measurement') in ['°C', '°F', 'K']\n   and -273.15 <= ((states(source_entity_1)
    | float - 32) * 5 / 9\n                   if state_attr(source_entity_1, 'unit_of_measurement')
    == '°F'\n                   else states(source_entity_1) | float - 273.15\n                   if
    state_attr(source_entity_1, 'unit_of_measurement') == 'K'\n                   else
    states(source_entity_1) | float) <= 327.67\n   and (not (supports_multi_remote_temperature
    | bool)\n        or source_entity_2 | trim == ''\n        or (source_entity_2
    not in (device_entities(target_device) or [])\n            and is_number(states(source_entity_2))\n
    \           and state_attr(source_entity_2, 'unit_of_measurement') in ['°C', '°F',
    'K']\n            and -273.15 <= ((states(source_entity_2) | float - 32) * 5 /
    9\n                            if state_attr(source_entity_2, 'unit_of_measurement')
    == '°F'\n                            else states(source_entity_2) | float - 273.15\n
    \                           if state_attr(source_entity_2, 'unit_of_measurement')
    == 'K'\n                            else states(source_entity_2) | float) <= 327.67))\n
    \  and (not (supports_multi_remote_temperature | bool)\n        or source_entity_3
    | trim == ''\n        or (source_entity_3 not in (device_entities(target_device)
    or [])\n            and is_number(states(source_entity_3))\n            and state_attr(source_entity_3,
    'unit_of_measurement') in ['°C', '°F', 'K']\n            and -273.15 <= ((states(source_entity_3)
    | float - 32) * 5 / 9\n                            if state_attr(source_entity_3,
    'unit_of_measurement') == '°F'\n                            else states(source_entity_3)
    | float - 273.15\n                            if state_attr(source_entity_3, 'unit_of_measurement')
    == 'K'\n                            else states(source_entity_3) | float) <= 327.67))
    }}\n"
actions:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ supports_multi_remote_temperature | bool }}'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ full_sync | bool or trigger.event.data.entity_id ==
            source_entity_1 }}'
        sequence:
        - action: zha.set_zigbee_cluster_attribute
          data:
            ieee: '{{ target_ieee | trim }}'
            endpoint_id: 1
            cluster_id: 64529
            cluster_type: in
            attribute: 65297
            value: "{% set value = states(source_entity_1) | float %} {% set unit
              = state_attr(source_entity_1, 'unit_of_measurement') %} {{ (((value
              - 32) * 5 / 9 if unit == '°F'\n     else value - 273.15 if unit == 'K'\n
              \    else value) * 100) | round(0) | int }}\n"
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ full_sync | bool or trigger.event.data.entity_id ==
            source_entity_2 }}'
        sequence:
        - action: zha.set_zigbee_cluster_attribute
          data:
            ieee: '{{ target_ieee | trim }}'
            endpoint_id: 1
            cluster_id: 64529
            cluster_type: in
            attribute: 65298
            value: "{% if source_entity_2 | trim == '' %}\n  -32768\n{% else %}\n
              \ {% set value = states(source_entity_2) | float %}\n  {% set unit =
              state_attr(source_entity_2, 'unit_of_measurement') %}\n  {{ (((value
              - 32) * 5 / 9 if unit == '°F'\n       else value - 273.15 if unit ==
              'K'\n       else value) * 100) | round(0) | int }}\n{% endif %}\n"
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ full_sync | bool or trigger.event.data.entity_id ==
            source_entity_3 }}'
        sequence:
        - action: zha.set_zigbee_cluster_attribute
          data:
            ieee: '{{ target_ieee | trim }}'
            endpoint_id: 1
            cluster_id: 64529
            cluster_type: in
            attribute: 65299
            value: "{% if source_entity_3 | trim == '' %}\n  -32768\n{% else %}\n
              \ {% set value = states(source_entity_3) | float %}\n  {% set unit =
              state_attr(source_entity_3, 'unit_of_measurement') %}\n  {{ (((value
              - 32) * 5 / 9 if unit == '°F'\n       else value - 273.15 if unit ==
              'K'\n       else value) * 100) | round(0) | int }}\n{% endif %}\n"
  - conditions:
    - condition: template
      value_template: '{{ not (supports_multi_remote_temperature | bool) }}'
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ full_sync | bool or trigger.event.data.entity_id ==
            source_entity_1 }}'
        sequence:
        - action: zha.set_zigbee_cluster_attribute
          data:
            ieee: '{{ target_ieee | trim }}'
            endpoint_id: 1
            cluster_id: 64529
            cluster_type: in
            attribute: 65297
            value: "{% set value = states(source_entity_1) | float %} {% set unit
              = state_attr(source_entity_1, 'unit_of_measurement') %} {{ (((value
              - 32) * 5 / 9 if unit == '°F'\n     else value - 273.15 if unit == 'K'\n
              \    else value) * 100) | round(0) | int }}\n"
mode: restart
